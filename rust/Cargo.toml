[package]
name = "ipma-proto"
description = "Versioned protobuf messages and gRPC bindings for the IPMA proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
prost-types = "0.14.4"
tonic = "0.14.9"
tonic-prost = "0.14.9"

[build-dependencies]
prost = "0.14.4"
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
