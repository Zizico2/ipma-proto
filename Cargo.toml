[workspace]
members = ["rust/ipma-proto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
tokio = "1.54.1"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"

[workspace.lints.rust]
unsafe_code = "forbid"
